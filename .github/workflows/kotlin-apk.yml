name: Kotlin Android APK Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

# Default permissions for all jobs
permissions:
  contents: read

jobs:
  test:
    name: Run Kotlin Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        
    - name: Install required Android SDK packages
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        echo "Installed SDK packages:"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x android_kotlin/gradlew
      
    - name: Compile project
      id: compile
      working-directory: android_kotlin
      run: |
        # Run compilation with reduced verbosity for readable error output
        ./gradlew compileDebugKotlin --continue --stacktrace --warning-mode all 2>&1 | tee compile_output.txt
        exit_code=${PIPESTATUS[0]}
        
        # If compilation failed, show the last 200 lines which usually contain the errors
        if [ $exit_code -ne 0 ]; then
          echo ""
          echo "::group::Compilation Errors (last 200 lines)"
          tail -200 compile_output.txt
          echo "::endgroup::"
          
          # Also extract and display just the error lines
          echo ""
          echo "::group::Error Summary"
          grep -E "^e: |error:|Error:|FAILURE:|BUILD FAILED" compile_output.txt || echo "No specific error pattern found - check full output above"
          echo "::endgroup::"
        fi
        
        exit $exit_code
      continue-on-error: true
      
    - name: Report compilation results
      if: always()
      run: |
        if [ "${{ steps.compile.outcome }}" == "failure" ]; then
          echo "::error::Compilation failed. Check the 'Compilation Errors' section above for details."
        else
          echo "::notice::Compilation succeeded!"
        fi
    
    - name: Upload compilation log on failure
      if: steps.compile.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: compile-error-log
        path: android_kotlin/compile_output.txt
        if-no-files-found: ignore
    
    - name: Run unit tests
      if: steps.compile.outcome == 'success'
      working-directory: android_kotlin
      run: ./gradlew testDebugUnitTest --continue
      continue-on-error: true
      id: unit-tests
      
    - name: Run lint checks
      if: steps.compile.outcome == 'success'
      working-directory: android_kotlin
      run: ./gradlew lintDebug --continue
      continue-on-error: true
      id: lint-checks
      
    - name: Report test and lint results
      if: always()
      run: |
        if [ "${{ steps.unit-tests.outcome }}" == "failure" ]; then
          echo "::error::Unit tests failed. Check test reports for details."
        fi
        if [ "${{ steps.lint-checks.outcome }}" == "failure" ]; then
          echo "::warning::Lint checks found issues. Check lint reports for details."
        fi
      
    - name: Fail workflow if compilation or tests failed
      if: always()
      run: |
        if [ "${{ steps.compile.outcome }}" == "failure" ] || [ "${{ steps.unit-tests.outcome }}" == "failure" ]; then
          echo "Workflow failed due to compilation or test failures"
          exit 1
        fi
      
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kotlin-test-reports
        path: |
          android_kotlin/app/build/reports/tests/
          android_kotlin/app/build/reports/lint-results-debug.html

  build:
    name: Build Kotlin Debug APK
    runs-on: ubuntu-latest
    needs: test
    if: always()  # Run even if test job fails to provide build diagnostics
    permissions:
      contents: read
    
    outputs:
      version-name: ${{ steps.version.outputs.version-name }}
      version-code: ${{ steps.version.outputs.version-code }}
      build-success: ${{ steps.build-debug.outcome == 'success' }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        
    - name: Install required Android SDK packages
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        echo "Installed SDK packages:"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x android_kotlin/gradlew
      
    - name: Extract version information
      id: version
      working-directory: android_kotlin
      run: |
        # Extract version from build.gradle.kts
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\([^"]*\)".*/\1/' || echo "1.0.0")
        VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*= *\([0-9]*\).*/\1/' || echo "1")
        echo "version-name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Version Name: $VERSION_NAME"
        echo "Version Code: $VERSION_CODE"
      continue-on-error: true
        
    - name: Build debug APK
      id: build-debug
      working-directory: android_kotlin
      run: |
        echo "Building debug APK..."
        # Run build with reduced verbosity for readable error output
        ./gradlew assembleDebug --continue --stacktrace --warning-mode all 2>&1 | tee build_output.txt
        exit_code=${PIPESTATUS[0]}
        
        # If build failed, show the last 200 lines which usually contain the errors
        if [ $exit_code -ne 0 ]; then
          echo ""
          echo "::group::Build Errors (last 200 lines)"
          tail -200 build_output.txt
          echo "::endgroup::"
          
          # Also extract and display just the error lines
          echo ""
          echo "::group::Error Summary"
          grep -E "^e: |error:|Error:|FAILURE:|BUILD FAILED" build_output.txt || echo "No specific error pattern found - check full output above"
          echo "::endgroup::"
        fi
        
        exit $exit_code
      continue-on-error: true
      
    - name: Report build status
      if: always()
      run: |
        if [ "${{ steps.build-debug.outcome }}" == "failure" ]; then
          echo "::error::Debug APK build failed. Check the 'Build Errors' section above for details."
        else
          echo "::notice::Debug APK built successfully!"
          echo "Features included:"
          echo "  - Jetpack Compose UI"
          echo "  - Room Database"
          echo "  - Hilt Dependency Injection"
          echo "  - Material 3 Design"
        fi
    
    - name: Upload build log on failure
      if: steps.build-debug.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: kotlin-build-error-log
        path: android_kotlin/build_output.txt
        if-no-files-found: ignore
        
    - name: Rename APK files
      if: steps.build-debug.outcome == 'success'
      run: |
        VERSION_NAME="${{ steps.version.outputs.version-name }}"
        
        mkdir -p android_kotlin/dist
        
        if [[ -f "android_kotlin/app/build/outputs/apk/debug/app-debug.apk" ]]; then
          cp android_kotlin/app/build/outputs/apk/debug/app-debug.apk \
             "android_kotlin/dist/AIChatRoom-v${VERSION_NAME}-debug.apk"
        fi
    
    - name: Generate checksums
      if: steps.build-debug.outcome == 'success'
      run: |
        VERSION_NAME="${{ steps.version.outputs.version-name }}"
        cd android_kotlin/dist
        
        # Generate SHA256 checksums for APK
        if [[ -f "AIChatRoom-v${VERSION_NAME}-debug.apk" ]]; then
          sha256sum "AIChatRoom-v${VERSION_NAME}-debug.apk" > "AIChatRoom-v${VERSION_NAME}-debug.apk.sha256"
        fi
        
        # Display checksums in the workflow log
        echo "=== APK Checksums ==="
        cat *.sha256 2>/dev/null || echo "No checksums generated"
        
    - name: Upload debug APK
      if: steps.build-debug.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: kotlin-debug-apk
        path: |
          android_kotlin/dist/AIChatRoom-v${{ steps.version.outputs.version-name }}-debug.apk
          android_kotlin/dist/AIChatRoom-v${{ steps.version.outputs.version-name }}-debug.apk.sha256

  release:
    name: Create GitHub Release (Kotlin APK)
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.build-success == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Download APK artifacts
      uses: actions/download-artifact@v4
      with:
        path: apks
        
    - name: Generate release notes
      id: release_notes
      run: |
        VERSION="${{ needs.build.outputs.version-name }}"
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        
        # Get commit messages since last tag
        PREVIOUS_TAG=$(git describe --abbrev=0 --tags "${TAG_NAME}^" 2>/dev/null || echo "")
        if [ -n "$PREVIOUS_TAG" ]; then
          COMMITS=$(git log "${PREVIOUS_TAG}..${TAG_NAME}" --pretty=format:"- %s" --no-merges)
        else
          COMMITS=$(git log "${TAG_NAME}" --pretty=format:"- %s" --no-merges --max-count=20)
        fi
        
        # Get checksum
        DEBUG_CHECKSUM="N/A"
        if [ -f "apks/kotlin-debug-apk/AIChatRoom-v${VERSION}-debug.apk.sha256" ]; then
          DEBUG_CHECKSUM=$(cat "apks/kotlin-debug-apk/AIChatRoom-v${VERSION}-debug.apk.sha256")
        fi
        
        cat > release_notes.md << EOF
        ## AI Chat Room (Kotlin) ${VERSION}
        
        Native Android app built with Kotlin, Jetpack Compose, and Material 3.
        
        ### 📱 System Requirements
        - Android 8.0+ (API level 26 or higher)
        - 100 MB free storage space
        
        ### 📦 Installation
        1. Download the APK below
        2. Enable "Install from unknown sources" in Android settings if needed
        3. Install the APK
        
        ### 🛠️ Technology Stack
        - **Kotlin** - Modern Android development
        - **Jetpack Compose** - Declarative UI
        - **Room Database** - Local persistence
        - **Hilt** - Dependency injection
        - **Material 3** - Latest design system
        - **Coroutines** - Async operations
        
        ### 🎉 Changes in this Release
        ${COMMITS}
        
        ### 🔐 Checksums (SHA256)
        \`\`\`
        ${DEBUG_CHECKSUM}
        \`\`\`
        
        For bug reports and feature requests, please visit the [Issues page](https://github.com/${{ github.repository }}/issues).
        EOF
        
        echo "release_body<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        name: AI Chat Room (Kotlin) ${{ needs.build.outputs.version-name }}
        body: ${{ steps.release_notes.outputs.release_body }}
        draft: false
        prerelease: false
        files: |
          ./apks/kotlin-debug-apk/AIChatRoom-v${{ needs.build.outputs.version-name }}-debug.apk
          ./apks/kotlin-debug-apk/AIChatRoom-v${{ needs.build.outputs.version-name }}-debug.apk.sha256
        fail_on_unmatched_files: false
