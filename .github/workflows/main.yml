name: Main CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NDK_VERSION: '25b'

# Default permissions for all jobs
permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Run tests
      id: tests
      run: |
        python -m pytest tests/ -v --tb=short 2>&1 | tee test_output.txt
        exit_code=${PIPESTATUS[0]}
        
        if [ $exit_code -ne 0 ]; then
          echo ""
          echo "::group::Test Failures"
          tail -100 test_output.txt
          echo "::endgroup::"
        fi
        
        exit $exit_code
      continue-on-error: true
      
    - name: Run linting
      id: lint
      run: |
        pip install flake8
        flake8 src/ chat_room.py android/main.py --max-line-length=120 --ignore=E501,W503
      continue-on-error: true
      
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: test_output.txt
        
    - name: Fail workflow if tests failed
      if: always()
      run: |
        if [ "${{ steps.tests.outcome }}" == "failure" ]; then
          echo "Tests failed"
          exit 1
        fi

  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    needs: test
    if: always()
    permissions:
      contents: read
    
    outputs:
      version-name: ${{ steps.version.outputs.version-name }}
      version-code: ${{ steps.version.outputs.version-code }}
      build-success: ${{ steps.build.outcome == 'success' }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libsqlite3-dev \
          libpq-dev \
          autoconf \
          automake \
          libtool \
          libtool-bin \
          libltdl-dev \
          pkg-config \
          m4 \
          cmake \
          unzip \
          ccache
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.36 virtualenv
        pip install kivy[base]==2.3.0
        
    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
          
    - name: Extract version information
      id: version
      run: |
        VERSION_NAME=$(grep "^version" pyproject.toml | head -1 | cut -d'"' -f2 || echo "1.0.0")
        VERSION_CODE=$(echo $VERSION_NAME | sed 's/\.//g' || echo "100")
        echo "version-name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "Version Name: $VERSION_NAME"
        echo "Version Code: $VERSION_CODE"
        
    - name: Build debug APK
      id: build
      run: |
        cd android
        
        # Initialize buildozer if spec doesn't exist
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        echo "Building debug APK..."
        buildozer android debug 2>&1 | tee build_output.txt
        exit_code=${PIPESTATUS[0]}
        
        if [ $exit_code -ne 0 ]; then
          echo ""
          echo "::group::Build Errors (last 200 lines)"
          tail -200 build_output.txt
          echo "::endgroup::"
        fi
        
        exit $exit_code
      continue-on-error: true
      timeout-minutes: 60
      
    - name: Report build status
      if: always()
      run: |
        if [ "${{ steps.build.outcome }}" == "failure" ]; then
          echo "::error::APK build failed. Check the build logs for details."
        else
          echo "::notice::APK built successfully!"
        fi
        
    - name: Upload build log on failure
      if: steps.build.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: build-error-log
        path: android/build_output.txt
        if-no-files-found: ignore
        
    - name: Find and rename APK
      if: steps.build.outcome == 'success'
      run: |
        VERSION_NAME="${{ steps.version.outputs.version-name }}"
        APK_PATH=$(find android/.buildozer -name "*.apk" -type f | head -1)
        
        if [ -n "$APK_PATH" ]; then
          mkdir -p android/dist
          cp "$APK_PATH" "android/dist/AIChat-v${VERSION_NAME}-debug.apk"
          sha256sum "android/dist/AIChat-v${VERSION_NAME}-debug.apk" > "android/dist/AIChat-v${VERSION_NAME}-debug.apk.sha256"
          echo "APK created: AIChat-v${VERSION_NAME}-debug.apk"
        else
          echo "No APK found"
          exit 1
        fi
        
    - name: Upload debug APK
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: |
          android/dist/AIChat-v${{ steps.version.outputs.version-name }}-debug.apk
          android/dist/AIChat-v${{ steps.version.outputs.version-name }}-debug.apk.sha256

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.build-success == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Download APK artifacts
      uses: actions/download-artifact@v4
      with:
        path: apks
        
    - name: Generate release notes
      id: release_notes
      run: |
        VERSION="${{ needs.build.outputs.version-name }}"
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        
        # Get commit messages since last tag
        PREVIOUS_TAG=$(git describe --abbrev=0 --tags "${TAG_NAME}^" 2>/dev/null || echo "")
        if [ -n "$PREVIOUS_TAG" ]; then
          COMMITS=$(git log "${PREVIOUS_TAG}..${TAG_NAME}" --pretty=format:"- %s" --no-merges)
        else
          COMMITS=$(git log "${TAG_NAME}" --pretty=format:"- %s" --no-merges --max-count=20)
        fi
        
        # Get checksum
        DEBUG_CHECKSUM="N/A"
        if [ -f "apks/debug-apk/AIChat-v${VERSION}-debug.apk.sha256" ]; then
          DEBUG_CHECKSUM=$(cat "apks/debug-apk/AIChat-v${VERSION}-debug.apk.sha256")
        fi
        
        cat > release_notes.md << EOF
        ## AI Chat Room ${VERSION}
        
        Multi-AI chat room powered by Gemma 3 4B for Pixel 10 Pro TPU.
        
        ### 📱 System Requirements
        - Android 8.0+ (API level 26 or higher)
        - 500 MB free storage space
        - Optional: Pixel 10 Pro for local TPU inference
        
        ### 📦 Installation
        1. Download the APK below
        2. Enable "Install from unknown sources" in Android settings if needed
        3. Install the APK
        4. On first launch, the app will guide you through model download
        
        ### 🤖 Features
        - 10 AI personalities with private conversations
        - 10M+ token RAG system with per-AI knowledge bases
        - 70+ document format support (PDF, EPUB, images, audio, video)
        - P2P networking to share LLMs with friends
        - Tool use (calculator, datetime, file operations)
        - Add-on/plugin system for extensibility
        
        ### 🎉 Changes in this Release
        ${COMMITS}
        
        ### 🔐 Checksums (SHA256)
        \`\`\`
        ${DEBUG_CHECKSUM}
        \`\`\`
        
        ### 📝 Model Download
        The app supports downloading models directly:
        - Gemma 3 4B (default, Pixel TPU optimized)
        - Gemma 3 1B (lighter, for older devices)
        
        For bug reports and feature requests, please visit the [Issues page](https://github.com/${{ github.repository }}/issues).
        EOF
        
        echo "release_body<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        name: AI Chat Room ${{ needs.build.outputs.version-name }}
        body: ${{ steps.release_notes.outputs.release_body }}
        draft: false
        prerelease: false
        files: |
          ./apks/debug-apk/AIChat-v${{ needs.build.outputs.version-name }}-debug.apk
          ./apks/debug-apk/AIChat-v${{ needs.build.outputs.version-name }}-debug.apk.sha256
        fail_on_unmatched_files: false
