name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Default permissions for all jobs
permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
          pip install -e ".[dev]"

      - name: Run Black (format check)
        run: |
          black --check --diff src/ chat_room.py tests/
        continue-on-error: true

      - name: Run isort (import sort check)
        run: |
          isort --check-only --diff src/ chat_room.py tests/
        continue-on-error: true

      - name: Run Flake8 (linting)
        run: |
          flake8 src/ chat_room.py --max-line-length=120 --ignore=E501,W503,E203 --statistics
        continue-on-error: true

      - name: Run MyPy (type checking)
        run: |
          mypy src/ chat_room.py --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Security check with Bandit
        run: |
          pip install bandit
          bandit -r src/ chat_room.py -ll -ii
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --exclude-files '\.git/.*' --exclude-files 'tests/.*'
        continue-on-error: true

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install safety
        run: pip install safety

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -e ".[dev]"
          safety check --full-report
        continue-on-error: true
